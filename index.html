<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wheel test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:#e6e6e6;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{width:260px;height:260px;position:relative}
  #wheel{width:100%;height:100%;display:block;transition:transform 15s cubic-bezier(.15,.65,.15,1);transform-origin:50% 50%}
  #status{margin-top:20px;font-size:12px;color:#666;text-align:center}
  button{padding:10px 18px;background:#111;border:1px solid #222;color:#e6e6e6;border-radius:6px;font-size:13px;margin-top:14px;cursor:pointer}
</style>
</head>
<body>
<div style="text-align:center">
  <div class="wrap">
    <svg id="wheel" viewBox="0 0 300 300"></svg>
  </div>
  <button id="spin">SPIN</button>
  <div id="status">ready</div>
</div>
<script>
var SEGMENTS = [
  { emoji:"😔", sol:"0",    color:"#181818" },
  { emoji:"💎", sol:"0.75", color:"#141414" },
  { emoji:"🔥", sol:"1.20", color:"#1c1c1c" },
  { emoji:"⚡", sol:"0.50", color:"#141414" },
  { emoji:"💰", sol:"1.50", color:"#1c1c1c" },
  { emoji:"🚀", sol:"0.90", color:"#141414" },
  { emoji:"🪙", sol:"0.65", color:"#1c1c1c" },
  { emoji:"🎁", sol:"2.00", color:"#141414" },
  { emoji:"⭐", sol:"0.80", color:"#1c1c1c" }
];
var N = SEGMENTS.length;
var SEG_DEG = 360 / N;

function build(){
  var svg = document.getElementById("wheel");
  var ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  var cx = 150, cy = 150, r = 148;
  for (var i = 0; i < N; i++){
    var s = SEGMENTS[i];
    var a0 = (i * SEG_DEG - 90) * Math.PI / 180;
    var a1 = ((i + 1) * SEG_DEG - 90) * Math.PI / 180;
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var path = document.createElementNS(ns, "path");
    path.setAttribute("d", "M " + cx + " " + cy + " L " + x0.toFixed(2) + " " + y0.toFixed(2) + " A " + r + " " + r + " 0 0 1 " + x1.toFixed(2) + " " + y1.toFixed(2) + " Z");
    path.setAttribute("fill", s.color);
    path.setAttribute("stroke", "#000");
    path.setAttribute("stroke-width", "1.5");
    svg.appendChild(path);
    var midDeg = i * SEG_DEG + SEG_DEG / 2 - 90;
    var midRad = midDeg * Math.PI / 180;
    var lr = r * 0.65;
    var lx = cx + lr * Math.cos(midRad), ly = cy + lr * Math.sin(midRad);
    var g = document.createElementNS(ns, "g");
    g.setAttribute("transform", "translate(" + lx.toFixed(2) + " " + ly.toFixed(2) + ") rotate(" + (midDeg + 90) + ")");
    var t1 = document.createElementNS(ns, "text");
    t1.setAttribute("x","0"); t1.setAttribute("y","-4"); t1.setAttribute("text-anchor","middle"); t1.setAttribute("font-size","22");
    t1.textContent = s.emoji; g.appendChild(t1);
    var t2 = document.createElementNS(ns, "text");
    t2.setAttribute("x","0"); t2.setAttribute("y","14"); t2.setAttribute("text-anchor","middle"); t2.setAttribute("font-size","11"); t2.setAttribute("fill","#cfcfcf");
    t2.textContent = s.sol + " SOL"; g.appendChild(t2);
    svg.appendChild(g);
  }
  document.getElementById("status").textContent = "wheel built: " + svg.childElementCount + " children";
}

var rot = 0;
document.getElementById("spin").onclick = function(){
  var idx = 1 + Math.floor(Math.random() * (N - 1));
  var targetDeg = 360 * 6 + (360 - idx * SEG_DEG) - SEG_DEG / 2;
  rot += targetDeg;
  document.getElementById("wheel").style.transform = "rotate(" + rot + "deg)";
  document.getElementById("status").textContent = "spinning to index " + idx;
  setTimeout(function(){
    document.getElementById("status").textContent = "result: " + SEGMENTS[idx].sol + " SOL";
  }, 15000);
};

build();
</script>
</body>
</html>
